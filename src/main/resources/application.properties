# =============================================
#  LocalShop PWA - Configuración de Aplicación
# =============================================

# Puerto del servidor
server.port=8080

# =============================================
#  Base de Datos H2 (en memoria)
# =============================================
spring.datasource.url=jdbc:h2:mem:localshopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear/actualizar esquema automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 accesible en /h2-console (solo para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
#  Thymeleaf
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
#  Logging
# =============================================
logging.level.com.pwa.localshop=DEBUG
logging.level.org.springframework.web=INFO
